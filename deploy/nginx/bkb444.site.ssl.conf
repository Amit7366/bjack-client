# HTTPS — used when Let's Encrypt certs exist under /etc/letsencrypt/live/bkb444.site

server {
    listen 80;
    listen [::]:80;
    server_name bkb444.site www.bkb444.site;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bkb444.site www.bkb444.site;

    ssl_certificate     /etc/letsencrypt/live/bkb444.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bkb444.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3044;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
