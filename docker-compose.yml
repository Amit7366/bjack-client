services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3020:3000" # VPS host 3020 (3000 is used by another service)
    environment:
      NODE_ENV: production
      API_URL: https://bkbajiapi.xyz
      GAME_LAUNCH_PROXY_URL: https://txserver.site/testGameLaunch.php
      GAME_AGENCY_UID: 0b98f74aa493413ce882a9edef9f9ede
      NEXT_PUBLIC_GAME_PLAYER_PREFIX: h037ad
    restart: unless-stopped

  dev:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    ports:
      - "3002:3000"
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    profiles:
      - dev

volumes:
  node_modules:
