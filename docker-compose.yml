services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SOCKET_URL: https://bkbajiapi.xyz
        NEXT_PUBLIC_SITE_URL: https://bkbaji.com
        NEXT_PUBLIC_GAME_PLAYER_PREFIX: h94044
    ports:
      - "3020:3000" # VPS host 3020 (3000 is used by another service)
    environment:
      NODE_ENV: production
      API_URL: https://bkbajiapi.xyz
      GAME_LAUNCH_PROXY_URL: https://txserver.site/newGameLaunch.php
      GAME_AGENCY_UID: 214391ef6669df671affeb79414d400e
      NEXT_PUBLIC_GAME_PLAYER_PREFIX: h94044
      NEXT_PUBLIC_SITE_URL: https://bkbaji.com
      NEXT_PUBLIC_SOCKET_URL: https://bkbajiapi.xyz
    restart: unless-stopped

  dev:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    ports:
      - "3002:3000"
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_SOCKET_URL: http://localhost:8000
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    profiles:
      - dev

volumes:
  node_modules:
