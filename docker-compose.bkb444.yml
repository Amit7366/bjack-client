name: bkb444-client

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SOCKET_URL: https://api.bkb444.site
        NEXT_PUBLIC_SITE_URL: https://bkb444.site
        NEXT_PUBLIC_GAME_PLAYER_PREFIX: h94044
    ports:
      # Unique host port so this stack does not collide with other apps on the VPS
      - "127.0.0.1:3044:3000"
    environment:
      NODE_ENV: production
      API_URL: https://api.bkb444.site
      GAME_LAUNCH_PROXY_URL: https://txserver.site/newGameLaunch.php
      GAME_AGENCY_UID: 214391ef6669df671affeb79414d400e
      NEXT_PUBLIC_GAME_PLAYER_PREFIX: h94044
      NEXT_PUBLIC_SITE_URL: https://bkb444.site
      NEXT_PUBLIC_SOCKET_URL: https://api.bkb444.site
    restart: unless-stopped
